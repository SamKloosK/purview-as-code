name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force

      - name: Lint
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer found errors.' }

      - name: Validate examples against the schema
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ./examples -Filter *.json) {
            Test-Json -Json (Get-Content $file -Raw) -SchemaFile ./schema/purview-config.schema.json -ErrorAction Stop | Out-Null
            "$($file.Name) is valid"
          }

      - name: Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
